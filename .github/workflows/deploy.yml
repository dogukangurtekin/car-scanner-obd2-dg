name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Gerekli repo secret'ları: SSH_HOST, SSH_USER, SSH_KEY (özel anahtar), SSH_PATH (alt alan adının web kökü)
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rsync ile sunucuya gönder
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude=.git --exclude=.github --exclude=docs --exclude=README.md
          path: ./
          remote_path: ${{ secrets.SSH_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
